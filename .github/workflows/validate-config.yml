name: Validate Social Media Config

on:
  push:
    paths:
      - "content/**"
      - "social_media_bot/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "content/**"
      - "social_media_bot/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YAML configuration
        run: python -c "from social_media_bot.config import load_content; load_content(); print('Config is valid.')"

      - name: Dry-run post selection
        run: python -m social_media_bot.poster --platforms twitter --dry-run
