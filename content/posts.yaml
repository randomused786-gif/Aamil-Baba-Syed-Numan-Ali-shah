# Social Media Post Definitions
#
# Each post has:
#   id:                  Unique identifier for the post
#   text:                The message body (keep under 280 chars for Twitter)
#   media:               Optional list of media files (relative to content/media/)
#                        or public URLs
#   instagram_image_url: Public URL required by Instagram Graph API
#   scheduled_date:      Date (YYYY-MM-DD) when this post should auto-publish
#   platforms:           Default platforms if not overridden via CLI

